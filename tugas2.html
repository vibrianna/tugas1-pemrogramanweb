
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <form action="#">


    <fieldset>
        <legend><b>Akun</b></legend>

        <table>

    <tr>
        <td><label for="username">Username</label></td>
        <td><input type="text" name="nama_pengguna" id="username"></td>
    </tr>

    <tr>
        <td><label for="password">Password</label></td>
        <td><input type="password" name="sandi" id="password"></td>
    </tr>

    <tr>
        <td><label for="konfirmasi">Konfirmasi Password</label></td>
        <td><input type="password" name="sandi" id="konfirmasi"></td>
    </tr>

    </table>
    </fieldset>


    <fieldset>
        <legend><b>Data</b></legend>

        <table>

    <tr>
        <td><label for="name">Nama</label></td>
        <td><input type="text" name="nama" id="nama"></td>
    </tr>

    <tr>
        <td><label for="jenis_kelamin">Jenis Kelamin</label></td>

        <td>
        <label for="pria"><input type="radio" name="jenis_kelamin" id="pria" value="Pria">Pria</label><br>
        <label for="wanita"><input type="radio" name="jenis_kelamin" id="wanita" value="Wanita">Wanita</label>
        </td>
    </tr>

    <tr>
        <td><label for="informasi">Kegiatan yang Disukai</label></td>

        <td>
        <label for="olahraga"><input type="checkbox" name="informasi" id="olahraga" value="Olahraga">Olahraga</label><br>
        <label for="travelling"><input type="checkbox" name="informasi" id="travelling" value="travelling">Travelling</label><br>
        <label for="Kesehatan"><input type="checkbox" name="informasi" id="shopping" value="shopping">Shopping</label>
        </td>
    </tr>

    <tr>
        <td><label for="game">Game Favorit</label></td>
        <td><select name="game" id="game">
            <option value="ml">Mobile Legends</option>
            <option value="genshin">Genshin Impact</option>
            <option value="ff">Free Fire</option>
            <option value="pubg">PUBG</option>
        </select></td>
    </tr>
    
    <tr>
        <td><label for="motto">Motto Hidup</label></td>
        <td>
            <textarea name="message" id="motto" rows="2" cols="40"></textarea>
        </td>
    </tr>
     
    </table>
    </fieldset>

     <button type="Submit" name="btn-submit">Submit</button>
     <button type="reset" name="btn-reset">Reset</button>
    </form>
</body>
</html>
